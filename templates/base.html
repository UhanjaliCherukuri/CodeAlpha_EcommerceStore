<!DOCTYPE html>
<html>
<head>

<title>CodeAlpha E-Commerce Store</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f5f5f5;
}

nav{
background:#222;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
color:white;
font-size:24px;
font-weight:bold;
}

.links a{

color:white;
text-decoration:none;
margin-left:20px;
font-weight:bold;

}

.container{

padding:30px;

}

button{

background:#007bff;
color:white;
border:none;
padding:10px 15px;
border-radius:5px;
cursor:pointer;

}

button:hover{

background:#0056b3;

}

.card{

background:white;
padding:20px;
border-radius:10px;
box-shadow:0px 2px 10px rgba(0,0,0,0.2);

}

</style>

</head>

<body>

<nav>

<div class="logo">

🛒 CodeAlpha Store

</div>

<div class="links">

<a href="/">Home</a>

<a href="/cart/">Cart</a>

{% if user.is_authenticated %}

<span style="color:white;">
Welcome {{ user.username }}
</span>

<a href="/logout/">Logout</a>

{% else %}

<a href="/register/">Register</a>

<a href="/login/">Login</a>

{% endif %}

</div>

</nav>

<div class="container">

{% block content %}

{% endblock %}

</div>
<hr>

<center>

<p>
© 2026 CodeAlpha E-Commerce Store
</p>

<p>
Developed by Uha for the CodeAlpha Full Stack Development Internship
</p>

</center>

</body>

</html>
