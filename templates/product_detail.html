{% extends 'base.html' %}

{% block content %}

<center>

<h1>{{ product.name }}</h1>

<img src="{{ product.image }}" width="300">

<h2>₹{{ product.price }}</h2>

<p>{{ product.description }}</p>

<h3>Available Stock: {{ product.stock }}</h3>

<br>

<a href="/add-to-cart/{{ product.id }}/">
<button>Add to Cart</button>
</a>

<br><br>

<a href="/">← Continue Shopping</a>

</center>

{% endblock %}
